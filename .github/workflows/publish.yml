name: Publish

# Publishes the extension to the Visual Studio Marketplace. Two channels:
# - production "ado-releases": a published GitHub release vX.Y.Z. The tag must equal the version in
#   vss-extension.json and packages/task/task.json (set both with `node scripts/version.mjs set X.Y.Z`).
# - dev "ado-releases-dev" (private, own task id, see scripts/dev-manifest.mjs): every push to main and
#   every GitHub pre-release, version 0.0.<run number>. Shared with the organizations in the repository
#   variable DEV_SHARE_WITH (space-separated, optional).
#
# Authentication without stored secrets: Marketplace trusted publishing. GitHub issues an OIDC
# token for the audience marketplace.visualstudio.com, the Marketplace exchanges it for a
# publisher credential valid for 15 minutes, and tfx uses that credential where it expects a PAT
# (same basic auth as vsce --oidc). Setup (see CONTRIBUTING.md "Releasing"): a Trusted Publishing policy on
# the publisher for this repository, workflow publish.yml and environment "marketplace".
# Sharing of a private extension with organizations is done once in the Marketplace and kept
# across updates.

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Extension to build: production (ado-releases) or dev (ado-releases-dev)"
        type: choice
        options: [dev, production]
        default: dev
      dry_run:
        description: "Package only, do not publish to the Marketplace"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Choose channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          case "$EVENT" in
            release) if [ "$PRERELEASE" = true ]; then channel=dev; else channel=production; fi ;;
            push) channel=dev ;;
            *) channel="$INPUT_CHANNEL" ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Channel: $channel"

      # A v0.1.0 tag must never ship a 0.2.0 build, and the task version must move with the
      # extension version, or agents keep running the previous task.
      - name: Verify versions
        run: node scripts/version.mjs check ${{ github.event_name == 'release' && steps.channel.outputs.channel == 'production' && github.ref_name || '' }}

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        id: package
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          manifest=vss-extension.json
          if [ "$CHANNEL" = dev ]; then
            node scripts/dev-manifest.mjs "0.0.${GITHUB_RUN_NUMBER}" "${GITHUB_SHA::7}"
            manifest=vss-extension.dev.json
          fi
          version="$(node -p "require('./$manifest').version")"
          publisher="$(node -p "require('./$manifest').publisher")"
          id="$(node -p "require('./$manifest').id")"
          vsix="${publisher}.${id}-${version}.vsix"
          npx --yes tfx-cli@0.24.2 extension create --manifest-globs "$manifest" --output-path "$vsix" --no-prompt
          { echo "vsix=$vsix"; echo "id=$id"; echo "version=$version"; echo "publisher=$publisher"; } >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

      - name: Publish to Marketplace
        if: >-
          github.event_name == 'release' || github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
        env:
          VSIX: ${{ steps.package.outputs.vsix }}
          publisher: ${{ steps.package.outputs.publisher }}
          id: ${{ steps.package.outputs.id }}
          version: ${{ steps.package.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          DEV_SHARE_WITH: ${{ vars.DEV_SHARE_WITH }}
        run: |
          set -euo pipefail
          # 1. GitHub OIDC token for the Marketplace audience (needs id-token: write).
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=marketplace.visualstudio.com" | jq -r .value)"
          echo "::add-mask::$oidc"
          # 2. Exchange it for a short-lived publisher credential (trusted publishing policy).
          credential="$(curl -fsS -X POST \
            -H "Authorization: FederatedToken $oidc" -H "Content-Type: application/json" \
            -d "{\"publisherName\":\"$publisher\"}" \
            "https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1" | jq -r .credential)"
          if [ -z "$credential" ] || [ "$credential" = null ]; then
            echo "::error::Marketplace token exchange returned no credential. Check the Trusted Publishing policy (repository, publish.yml, environment marketplace)."
            exit 1
          fi
          echo "::add-mask::$credential"
          # 3. tfx sends it as basic auth, like a PAT. Upload without tfx's own validation wait: it
          #    gives up after about 4 minutes, while the Marketplace validation can take longer.
          #    The dev extension is private; sharing is kept across updates, so sharing on every publish is harmless.
          share=()
          if [ "$CHANNEL" = dev ] && [ -n "${DEV_SHARE_WITH:-}" ]; then
            # shellcheck disable=SC2206 # space-separated list of organizations
            share=(--share-with $DEV_SHARE_WITH)
          fi
          npx --yes tfx-cli@0.24.2 extension publish --vsix "$VSIX" --auth-type pat --token "$credential" --no-prompt --no-wait-validation "${share[@]}"
          # 4. Wait for the validation while the credential is still valid (15 minutes). Fail on a
          #    validation error; if it is still pending, warn: the Marketplace finishes it on its own.
          status=pending
          for _ in $(seq 1 24); do
            sleep 30
            status="$( (npx --yes tfx-cli@0.24.2 extension isvalid --publisher "$publisher" --extension-id "$id" --version "$version" \
              --auth-type pat --token "$credential" --no-prompt --json || true) | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/\{[\s\S]*\}/);const r=m?JSON.parse(m[0]):{status:"pending"};console.log(r.status==="error"?`error: ${r.message}`:r.status)})')"
            echo "validation: $status"
            [ "$status" = pending ] || break
          done
          case "$status" in
            success) echo "Published $publisher.$id $version." ;;
            pending) echo "::warning::Validation of $version is still running in the Marketplace; check Manage publisher." ;;
            *) echo "::error::Marketplace validation of $version failed: $status"; exit 1 ;;
          esac

      # Runs even when the publish step failed (e.g. the version is already on the Marketplace),
      # so every release with a successful build carries its vsix.
      - name: Attach VSIX to the release
        if: always() && github.event_name == 'release' && steps.package.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.package.outputs.vsix }}" --clobber
